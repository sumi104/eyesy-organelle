<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EYESY Simulator</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <h1>EYESY <span>Simulator</span></h1>
  <div class="path">
    <span id="modes-path" title="モードフォルダ"></span>
    <button id="choose-folder" class="ghost">フォルダを選択…</button>
    <button id="rescan" class="ghost">再スキャン</button>
  </div>
  <div class="stats">
    <span id="stat-fps">-- fps</span>
    <span id="stat-res">--</span>
    <span id="stat-encode">--</span>
  </div>
</header>

<main>

  <aside id="mode-list-pane">
    <input id="mode-filter" type="search" placeholder="モードを検索" autocomplete="off">
    <ul id="mode-list"></ul>
    <div id="mode-count"></div>
  </aside>

  <section id="stage">
    <div id="screen-wrap">
      <img id="screen" alt="EYESY output">
    </div>

    <div id="controls">
      <div id="knobs"></div>

      <div id="keys"></div>
    </div>

    <div id="bottom">
      <div class="panel">
        <h2>オーディオ入力</h2>
        <select id="audio-device"></select>
        <label class="slider">
          <span>Gain</span>
          <input id="gain" type="range" min="0" max="1" step="0.005">
          <output id="gain-value"></output>
        </label>
        <div class="meter"><div id="peak-l"></div></div>
        <div class="meter"><div id="peak-r"></div></div>
        <div id="audio-error" class="error"></div>
      </div>

      <div class="panel">
        <h2>ストリーム</h2>
        <label class="row"><span>幅</span>
          <select id="stream-width">
            <option value="320">320</option>
            <option value="480">480</option>
            <option value="640">640</option>
            <option value="960">960</option>
            <option value="1280">1280</option>
          </select>
        </label>
        <label class="row"><span>fps</span>
          <select id="stream-fps">
            <option value="10">10</option>
            <option value="15">15</option>
            <option value="20">20</option>
            <option value="30">30</option>
          </select>
        </label>
        <label class="row checkbox"><input id="stream-smooth" type="checkbox"><span>スムージング</span></label>
        <label class="row"><span>トリガ</span>
          <select id="trigger-source">
            <option value="0">Audio</option>
            <option value="1">MIDI Note</option>
            <option value="2">Audio or MIDI</option>
          </select>
        </label>
      </div>

      <div class="panel" id="status-panel">
        <h2>ステータス</h2>
        <div id="flags"></div>
        <pre id="error"></pre>
      </div>
    </div>
  </section>

  <section id="editor-pane">
    <div id="editor-head">
      <span id="editor-title">エディタ</span>
      <select id="editor-file"></select>
      <button id="save" class="primary">保存して再読込 <kbd>⌘S</kbd></button>
      <button id="editor-toggle" class="ghost">閉じる</button>
    </div>
    <div id="editor"></div>
    <div id="editor-status"></div>
  </section>

</main>

<button id="editor-open" class="ghost">エディタを開く</button>

<script src="/ace/ace.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
